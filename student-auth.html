<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Skill Orbit</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="orbit-background">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="auth-container fade-in-up">
        <!-- Auth Card -->
        <div class="auth-card glass-effect">
            
            <!-- Form Header (Toggle) -->
            <div class="auth-toggle">
                <button class="toggle-btn active" id="show-login">Login</button>
                <button class="toggle-btn" id="show-signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active-form">
                <h2 class="form-title">Welcome Back!</h2>
                <p class="form-subtitle">Login to access your study materials.</p>
                
                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                </div>

                <div class="form-options">
                    <a href="#" id="forgot-password" class="forgot-text">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary full-width" id="login-btn">Login</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden-form">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Join Skill Orbit for premium notes.</p>
                
                <div class="input-group">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="signup-email" placeholder="Email Address" required>
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="signup-password" placeholder="Password (Min 6 chars)" required>
                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                </div>

                <button type="submit" class="btn btn-primary full-width" id="signup-btn">Sign Up</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Google Sign in -->
            <button class="btn-google full-width" id="google-signin-btn">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>
            
            <!-- Error/Success Message Container -->
            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <!-- Firebase Type Module -->
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
